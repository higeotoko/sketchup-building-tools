<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchUPbuildingTool 階別一覧</title>
<link rel="stylesheet" href="palette.css">
<style>
  .filters { display:flex; flex-wrap:wrap; align-items:end; gap:8px; }
  .filters label { min-width:100px; }
  .table-wrap { overflow:auto; max-height:65vh; }
  table { border-collapse:collapse; width:100%; white-space:nowrap; font-size:12px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #d4e0e5; }
  th { background:#e7f1f3; position:sticky; top:0; }
  tbody button { min-height:26px; padding:1px 6px; }
</style>
<header><img src="palette.svg" alt=""><div><span>SketchUPbuildingTool</span><h1>階別一覧</h1></div></header>
<main>
  <section class="filters">
    <label>階 <select id="level"></select></label>
    <label>種別 <select id="kind"></select></label>
    <button id="refresh">モデルから更新</button>
    <button id="export">表示中の行をCSV保存</button>
    <output id="count" aria-live="polite"></output>
  </section>
  <section class="table-wrap"><table><thead></thead><tbody></tbody></table></section>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
let data;
function options(control, values) {
  const old = control.value;
  control.replaceChildren(new Option("すべて", ""), ...[...new Set(values)].map(value => new Option(value, value)));
  if (values.includes(old)) control.value = old;
}
function render() {
  if (!data) return;
  const rows = data.rows.filter(({values}) =>
    (!byId("level").value || byId("level").value === values[0]) && (!byId("kind").value || byId("kind").value === values[1]));
  document.querySelector("tbody").replaceChildren(...rows.map(({values, target}) => {
    const row = document.createElement("tr");
    const button = document.createElement("button");
    button.textContent = values[8] ? "親壁を選択" : "選択";
    button.addEventListener("click", () => sketchup.select(data.token, target));
    row.insertCell().append(button);
    [...values.slice(0, 8), values[10], values[11]].forEach(value => { row.insertCell().textContent = value ?? "—"; });
    return row;
  }));
  byId("count").textContent = rows.length + " 件";
}
function receiveSchedule(next) {
  data = next;
  options(byId("level"), data.rows.map(row => row.values[0]));
  options(byId("kind"), data.rows.map(row => row.values[1]));
  const heading = document.createElement("tr");
  ["モデル", ...data.headers.slice(0, 8), ...data.headers.slice(10)].forEach(text => {
    const cell = document.createElement("th");
    cell.textContent = text;
    heading.append(cell);
  });
  document.querySelector("thead").replaceChildren(heading);
  render();
}
byId("level").addEventListener("change", render);
byId("kind").addEventListener("change", render);
byId("refresh").addEventListener("click", () => sketchup.refresh());
byId("export").addEventListener("click", () => { if (data) sketchup.csv(data.token, byId("level").value, byId("kind").value); });
document.addEventListener("DOMContentLoaded", () => sketchup.refresh());
</script>
